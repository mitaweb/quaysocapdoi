<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vòng Quay Ghép Cặp Đôi</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #080818;
  color: #fff;
  font-family: 'Segoe UI', 'Be Vietnam Pro', Arial, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ---- STARFIELD ---- */
#stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

/* ---- LAYOUT ---- */
.wrapper {
  position: relative;
  z-index: 1;
  max-width: 1060px;
  margin: 0 auto;
  padding: 24px 16px 60px;
}

/* ---- HEADER ---- */
.title {
  text-align: center;
  font-size: clamp(1.7rem, 4.5vw, 2.8rem);
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 4px;
  background: linear-gradient(90deg, #FFD700 0%, #FF8C00 45%, #FFD700 100%);
  background-size: 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shimmer 3s linear infinite;
  padding: 6px 0;
}
@keyframes shimmer { to { background-position: 200%; } }

.subtitle {
  text-align: center;
  font-size: .8rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255,255,255,.35);
  margin-bottom: 14px;
}

/* ---- PROGRESS ---- */
.progress-wrap {
  max-width: 420px;
  margin: 0 auto 6px;
}
.progress-track {
  height: 8px;
  background: rgba(255,255,255,.1);
  border-radius: 99px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, #FFD700, #FF4500);
  width: 0%;
  transition: width .6s ease;
}
.progress-label {
  text-align: center;
  font-size: .95rem;
  font-weight: 700;
  color: #FFD700;
  margin-top: 6px;
}

/* ---- SLOTS ---- */
.slots-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(8px, 2.5vw, 28px);
  padding: 28px 0 20px;
}

.slot-card {
  flex: 1;
  max-width: 400px;
  min-height: 170px;
  background: linear-gradient(150deg, #131332, #0e2040);
  border: 2px solid rgba(255,215,0,.3);
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 18px 14px;
  position: relative;
  overflow: hidden;
  transition: border-color .3s, box-shadow .3s;
}
.slot-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(255,215,0,.08) 0%, transparent 65%);
  pointer-events: none;
}
.slot-card.spinning {
  border-color: rgba(255,165,0,.85);
  box-shadow: 0 0 28px rgba(255,140,0,.35);
  animation: cardPulse .35s ease-in-out infinite alternate;
}
@keyframes cardPulse {
  from { transform: scale(1); }
  to   { transform: scale(1.015); }
}
.slot-card.revealed {
  border-color: #FFD700;
  box-shadow: 0 0 50px rgba(255,215,0,.55), 0 0 100px rgba(255,215,0,.2);
}

.slot-badge {
  font-size: .65rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,255,255,.3);
}

.slot-name {
  font-size: clamp(1rem, 2.8vw, 1.55rem);
  font-weight: 800;
  text-align: center;
  line-height: 1.3;
  color: rgba(255,255,255,.7);
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
}
.slot-card.spinning .slot-name {
  color: #FFD700;
  text-shadow: 0 0 12px rgba(255,215,0,.6);
}
.slot-card.revealed .slot-name {
  color: #FFD700;
  font-size: clamp(1.15rem, 3.2vw, 1.75rem);
  text-shadow: 0 0 18px rgba(255,215,0,.8);
  animation: popIn .45s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn {
  from { transform: scale(.5); opacity: 0; }
  to   { transform: scale(1);  opacity: 1; }
}

.connector {
  font-size: 2.2rem;
  color: #FF4466;
  flex-shrink: 0;
  line-height: 1;
  filter: drop-shadow(0 0 8px rgba(255,68,102,.5));
}

/* ---- BUTTON ---- */
.btn-row { text-align: center; margin-bottom: 28px; }

.spin-btn {
  display: inline-block;
  padding: 16px 64px;
  font-size: 1.25rem;
  font-weight: 900;
  font-family: inherit;
  letter-spacing: 4px;
  text-transform: uppercase;
  background: linear-gradient(135deg, #FFD700 0%, #FF8C00 55%, #FF4500 100%);
  color: #000;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform .25s, box-shadow .25s, opacity .25s;
  box-shadow: 0 6px 35px rgba(255,120,0,.55);
}
.spin-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(160deg, rgba(255,255,255,.22) 0%, transparent 55%);
  pointer-events: none;
}
.spin-btn:hover:not(:disabled) {
  transform: translateY(-4px);
  box-shadow: 0 12px 45px rgba(255,120,0,.75);
}
.spin-btn:active:not(:disabled) { transform: translateY(0); }
.spin-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

/* ---- COMPLETE BANNER ---- */
.done-banner {
  display: none;
  text-align: center;
  padding: 18px;
  background: linear-gradient(135deg,rgba(255,215,0,.12),rgba(255,69,0,.12));
  border: 1px solid rgba(255,215,0,.4);
  border-radius: 16px;
  margin-bottom: 22px;
  font-size: 1.35rem;
  font-weight: 900;
  color: #FFD700;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.done-banner.show {
  display: block;
  animation: popIn .6s cubic-bezier(.34,1.56,.64,1);
}

/* ---- DIVIDER ---- */
.divider {
  height: 1px;
  background: linear-gradient(90deg,transparent,rgba(255,215,0,.25),transparent);
  margin: 8px 0 24px;
}

/* ---- TWO-COLUMN GRID ---- */
.content-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}
@media (max-width: 640px) { .content-grid { grid-template-columns: 1fr; } }

.panel-head {
  font-size: .75rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(255,215,0,.65);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel-head::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255,215,0,.18);
}

/* ---- MEMBERS CHIPS ---- */
.chips-wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  max-height: 310px;
  overflow-y: auto;
  padding-right: 4px;
}
.chips-wrap::-webkit-scrollbar { width: 4px; }
.chips-wrap::-webkit-scrollbar-thumb { background: rgba(255,215,0,.3); border-radius: 2px; }

.chip {
  padding: 4px 10px;
  border-radius: 16px;
  font-size: .72rem;
  font-weight: 600;
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.14);
  color: rgba(255,255,255,.85);
  transition: all .4s;
  white-space: nowrap;
}
.chip.done {
  background: rgba(255,255,255,.02);
  border-color: rgba(255,255,255,.06);
  color: rgba(255,255,255,.18);
  text-decoration: line-through;
}
.chip.spotlight {
  background: rgba(255,215,0,.2);
  border-color: #FFD700;
  color: #FFD700;
  transform: scale(1.1);
  box-shadow: 0 0 10px rgba(255,215,0,.4);
}

/* ---- PAIRS LIST ---- */
.pairs-scroll {
  max-height: 310px;
  overflow-y: auto;
  padding-right: 4px;
}
.pairs-scroll::-webkit-scrollbar { width: 4px; }
.pairs-scroll::-webkit-scrollbar-thumb { background: rgba(255,215,0,.3); border-radius: 2px; }

.pair-row {
  display: grid;
  grid-template-columns: 26px 1fr 20px 1fr;
  align-items: center;
  gap: 6px;
  padding: 8px 10px;
  margin-bottom: 6px;
  background: rgba(255,255,255,.04);
  border: 1px solid rgba(255,215,0,.14);
  border-radius: 10px;
  font-size: .78rem;
  animation: slideLeft .4s ease;
}
@keyframes slideLeft {
  from { opacity: 0; transform: translateX(-18px); }
  to   { opacity: 1; transform: translateX(0); }
}
.pr-num { color: #FFD700; font-weight: 800; font-size: .72rem; }
.pr-name { font-weight: 600; color: rgba(255,255,255,.9); text-align: center; }
.pr-heart { color: #FF4466; text-align: center; font-size: .95rem; }
.no-pairs-msg { color: rgba(255,255,255,.28); font-size: .82rem; text-align: center; padding: 22px 0; }

/* ---- CONFETTI ---- */
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 200; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<canvas id="confetti"></canvas>

<div class="wrapper">

  <div class="title">🎲 Vòng Quay Ghép Cặp</div>
  <div class="subtitle">Lucky Draw Pairing System</div>

  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">Cặp 1 / 26</div>
  </div>

  <div class="slots-row">
    <div class="slot-card" id="card1">
      <div class="slot-badge">Thành viên A</div>
      <div class="slot-name" id="sname1">?</div>
    </div>

    <div class="connector">💞</div>

    <div class="slot-card" id="card2">
      <div class="slot-badge">Thành viên B</div>
      <div class="slot-name" id="sname2">?</div>
    </div>
  </div>

  <div class="btn-row">
    <button class="spin-btn" id="spinBtn" onclick="spin()">🎯 Quay Ngay</button>
  </div>

  <div class="done-banner" id="doneBanner">🎉 Đã ghép xong tất cả 26 cặp! 🎉</div>

  <div class="divider"></div>

  <div class="content-grid">
    <div>
      <div class="panel-head">Thành viên chưa ghép &nbsp;<span id="remainLabel">52</span></div>
      <div class="chips-wrap" id="chipsWrap"></div>
    </div>
    <div>
      <div class="panel-head">Các cặp đã ghép &nbsp;<span id="pairsLabel">0</span></div>
      <div class="pairs-scroll">
        <ul id="pairsList" style="list-style:none">
          <li class="no-pairs-msg">Chưa có cặp nào</li>
        </ul>
      </div>
    </div>
  </div>

</div>

<script>
// ─── DATA ─────────────────────────────────────────────────────────────────────
// Hạt giống (26 thành viên – nhóm A, nội bộ)
const GROUP_A = [
  "Biên Thị Anh Thư",
  "Đặng Lan Hương",
  "Đặng Thiên Thư",
  "Đặng Văn Tiên",
  "Đinh Thị Xuân Thu",
  "Đoàn Thị Tiên",
  "Hồ Minh Tâm",
  "Lê Minh Trực",
  "Mai Xuân Lộc",
  "Nguyễn Định Sàm",
  "Nguyễn Đỗ Thu Hằng",
  "Nguyễn Kim Ngân",
  "Nguyễn Thị Liêm",
  "Nguyễn Tý",
  "Nguyễn Văn Toản",
  "Nguyễn Văn Việt Thành",
  "Nguyễn Việt Cường",
  "Nguyễn Xuân Thạch",
  "Phạm Ngọc",
  "Phạm Thị Thương",
  "Phùng Ngọc Linh",
  "Thổ Thị Thanh Thảo",
  "Trần Hải Yến (Ms Bảo Anh)",
  "Trần Lê Ca Thương",
  "Trịnh Thị Lam Tuyền",
  "Trương Quốc Tiến"
];

// Nhóm B (26 thành viên – nội bộ)
const GROUP_B = [
  "Đặng Nguyễn Quốc Anh",
  "Lê Hoàng Hải",
  "Phạm Minh Sang",
  "Trần Mai Anh",
  "Trần Thị Thu Hương",
  "Phạm Thị Bích Thuỷ",
  "Nguyễn Qui Tình",
  "Nguyễn Thế Bút",
  "Lê Thị Hiền",
  "Vương Vi Hoàn",
  "Lê Đình Tân",
  "Huỳnh Quốc Vương",
  "July Trần",
  "Phạm Hoàng Tú",
  "Đặng Phương Linh",
  "Nguyễn Vinh Quang",
  "Nguyễn Thị Huyền Trân",
  "Trần Lan Anh",
  "Lê Quốc Thái",
  "Lý Trần Hồng Vân",
  "Võ Huy",
  "Nguyễn Khánh Nghi",
  "Mai Thanh Giang",
  "Nguyễn Văn Cường",
  "Trần Ngọc Minh Thư",
  "Phạm Quốc Việt"
];

const TOTAL_PAIRS = GROUP_A.length; // 26

// ─── STATE ────────────────────────────────────────────────────────────────────
let poolA  = shuffle([...GROUP_A]);
let poolB  = shuffle([...GROUP_B]);
let pairs  = [];
let done   = new Set();
let busy   = false;

// Chip element map (name → DOM el), built in renderChips()
const chipMap = new Map();

// Pre-shuffle combined display order (hides groups from audience)
const displayOrder = shuffle([...GROUP_A, ...GROUP_B]);

// ─── BOOT ─────────────────────────────────────────────────────────────────────
initStars();
renderChips();
updateProgress();

// ─── SPIN ─────────────────────────────────────────────────────────────────────
function spin() {
  if (busy || poolA.length === 0) return;
  busy = true;
  document.getElementById('spinBtn').disabled = true;

  const ai = rndIdx(poolA), bi = rndIdx(poolB);
  const pickA = poolA[ai], pickB = poolB[bi];

  // Randomise left/right so audience can't detect pattern
  const [left, right] = Math.random() < .5 ? [pickA, pickB] : [pickB, pickA];

  const card1 = document.getElementById('card1');
  const card2 = document.getElementById('card2');
  const n1    = document.getElementById('sname1');
  const n2    = document.getElementById('sname2');
  const spinNames = [...poolA, ...poolB]; // only remaining names scroll by

  card1.className = 'slot-card spinning';
  card2.className = 'slot-card spinning';
  n1.textContent  = '…';
  n2.textContent  = '…';

  // Card 1 stops at 3.2 s
  animSlot(n1, spinNames, left, 3200, () => {
    card1.className = 'slot-card revealed';
    glow(left);
  });

  // Card 2 stops at 4.4 s
  animSlot(n2, spinNames, right, 4400, () => {
    card2.className = 'slot-card revealed';
    glow(right);
    burst();

    setTimeout(() => {
      poolA.splice(ai, 1);
      poolB.splice(bi, 1);
      done.add(pickA);
      done.add(pickB);
      pairs.unshift({ a: left, b: right });

      updateProgress();
      updateChips();
      updatePairs();
      busy = false;

      if (poolA.length > 0) {
        document.getElementById('spinBtn').disabled = false;
      } else {
        document.getElementById('spinBtn').textContent = '🎉 Hoàn thành!';
        document.getElementById('doneBanner').classList.add('show');
        setTimeout(burst, 300);
        setTimeout(burst, 700);
      }
    }, 1600);
  });
}

// ─── SLOT ANIMATION ───────────────────────────────────────────────────────────
function animSlot(el, names, target, ms, cb) {
  const t0 = performance.now();
  let lastFlip = 0;

  function frame(now) {
    const elapsed  = now - t0;
    const progress = Math.min(elapsed / ms, 1);

    // Decelerate: delay between flips grows with progress
    const delay = progress < .5 ? 55 :
                  progress < .7 ? 90 :
                  progress < .85 ? 160 :
                  progress < .95 ? 300 : 500;

    if (progress >= 1) {
      el.textContent = target;
      cb && cb();
      return;
    }

    if (now - lastFlip >= delay) {
      el.textContent = names[Math.floor(Math.random() * names.length)];
      lastFlip = now;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// ─── UI HELPERS ───────────────────────────────────────────────────────────────
function renderChips() {
  const wrap = document.getElementById('chipsWrap');
  wrap.innerHTML = '';
  displayOrder.forEach(name => {
    const el = document.createElement('div');
    el.className = 'chip';
    el.textContent = name;
    chipMap.set(name, el);
    wrap.appendChild(el);
  });
}

function updateChips() {
  document.getElementById('remainLabel').textContent = poolA.length + poolB.length;
  done.forEach(name => {
    const el = chipMap.get(name);
    if (el) el.className = 'chip done';
  });
}

function glow(name) {
  const el = chipMap.get(name);
  if (!el) return;
  el.classList.add('spotlight');
  setTimeout(() => el.classList.remove('spotlight'), 2000);
}

function updateProgress() {
  const n = pairs.length;
  document.getElementById('progressFill').style.width = (n / TOTAL_PAIRS * 100) + '%';
  document.getElementById('progressLabel').textContent =
    n < TOTAL_PAIRS ? `Cặp ${n + 1} / ${TOTAL_PAIRS}` : `Đã ghép xong ${TOTAL_PAIRS} cặp 🎉`;
}

function updatePairs() {
  document.getElementById('pairsLabel').textContent = pairs.length;
  const ul = document.getElementById('pairsList');
  ul.innerHTML = '';
  pairs.forEach((p, i) => {
    const num = pairs.length - i;
    const li = document.createElement('li');
    li.className = 'pair-row';
    li.innerHTML = `<span class="pr-num">${num}</span>
      <span class="pr-name">${p.a}</span>
      <span class="pr-heart">💞</span>
      <span class="pr-name">${p.b}</span>`;
    ul.appendChild(li);
  });
}

// ─── CONFETTI ─────────────────────────────────────────────────────────────────
function burst() {
  const cv  = document.getElementById('confetti');
  const ctx = cv.getContext('2d');
  cv.width  = innerWidth;
  cv.height = innerHeight;

  const COLORS = ['#FFD700','#FF4466','#00CFFF','#7FFF00','#FF69B4','#FF8C00'];
  const pts = Array.from({ length: 130 }, () => ({
    x: Math.random() * cv.width,
    y: -12,
    r: Math.random() * 6 + 2,
    vx: (Math.random() - .5) * 4.5,
    vy: Math.random() * 4 + 2,
    rot: Math.random() * 360,
    drot: (Math.random() - .5) * 6,
    color: COLORS[Math.floor(Math.random() * COLORS.length)],
    rect: Math.random() < .5
  }));

  let f = 0;
  const MAX = 130;
  (function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    const alpha = Math.max(0, 1 - f / MAX);
    pts.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += .12; p.rot += p.drot;
      if (p.y > cv.height + 20) return;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      p.rect ? ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r)
             : (ctx.beginPath(), ctx.arc(0, 0, p.r, 0, Math.PI * 2), ctx.fill());
      ctx.restore();
    });
    if (++f <= MAX) requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}

// ─── STAR BACKGROUND ──────────────────────────────────────────────────────────
function initStars() {
  const cv  = document.getElementById('stars');
  const ctx = cv.getContext('2d');
  const resize = () => { cv.width = innerWidth; cv.height = innerHeight; };
  resize();
  window.addEventListener('resize', resize);

  const stars = Array.from({ length: 90 }, () => ({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    r: Math.random() * 1.4 + .3,
    a: Math.random(),
    da: Math.random() * .018 + .004
  }));

  (function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    stars.forEach(s => {
      s.a += s.da;
      if (s.a > 1 || s.a < 0) s.da *= -1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,220,100,${s.a * .55})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  })();
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function rndIdx(arr) { return Math.floor(Math.random() * arr.length); }
</script>
</body>
